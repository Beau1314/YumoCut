description = "画面撕裂成横带左右跳动、在两个镜头间闪烁，直到下一个镜头稳住。"
category = "故障"

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 70

[param.i18n."zh-Hans"]
label = "程度"

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
