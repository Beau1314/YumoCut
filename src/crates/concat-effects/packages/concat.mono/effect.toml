format = 2

[effect]
id = "concat.mono"
name = "Mono"
kind = "filter"
category = "Retro"
order = 43
intensity = "contrast"
description = "Black and white through a coloured filter: red darkens skies and lightens skin, green does the reverse. A little grain if you want it."

[effect.i18n."zh-Hans"]
name = "黑白"
description = "经彩色滤镜的黑白：红镜压暗天空提亮肤色，绿镜相反。想要的话来一点颗粒。"
category = "复古"

[[param]]
key = "colour"
label = "Colour filter"
min = -100
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "色彩滤镜"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "对比度"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "颗粒"

[wgsl]
entry = "effect.wgsl"
space = "display"
