format = 2

[effect]
id = "concat.bronze"
name = "Bronze"
kind = "filter"
category = "Retro"
order = 42
intensity = "tone"
description = "Sepia that keeps its contrast and its highlights, so it reads as old film rather than a brown wash."

[effect.i18n."zh-Hans"]
name = "青铜"
description = "保住对比与高光的深棕调，读起来像老胶片而不是一层棕色水洗。"
category = "复古"

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "色调"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "对比度"

[wgsl]
entry = "effect.wgsl"
space = "display"
