format = 2

[effect]
id = "concat.beat-shake"
name = "Beat Shake"
kind = "effect"
category = "Shake"
order = 6
intensity = "amount"
description = "A hit on every beat at the tempo you set, each knocked a different way, from the moment the clip or layer starts."

[effect.i18n."zh-Hans"]
name = "节拍抖动"
description = "按你设定的速度在每一拍上敲一下，每次方向各异，从片段或图层开始时刻起算。"
category = "抖动"

[[param]]
key = "bpm"
label = "Tempo"
unit = "BPM"
min = 40
max = 240
step = 1
default = 120

[param.i18n."zh-Hans"]
label = "速度"

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[param.i18n."zh-Hans"]
label = "程度"

[[param]]
key = "length"
label = "Hit Length"
unit = "%"
min = 10
max = 100
step = 1
default = 60

[param.i18n."zh-Hans"]
label = "击打长度"

[[param]]
key = "punch"
label = "Zoom Punch"
unit = "%"
min = 0
max = 100
step = 1
default = 30

[param.i18n."zh-Hans"]
label = "变焦冲击"

[[param]]
key = "blur"
label = "Motion Blur"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[param.i18n."zh-Hans"]
label = "运动模糊"

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.04
