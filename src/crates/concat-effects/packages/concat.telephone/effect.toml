[effect]
id = "concat.telephone"
name = "Telephone"
kind = "audio"
category = "Tone"
order = 22
intensity = "drive"
aliases = ["telephone"]
description = "The narrow band of a phone line."

[effect.i18n."zh-Hans"]
name = "电话"
description = "电话线的窄频带。"
category = "音色"

[[param]]
key = "drive"
label = "Drive"
min = 0
max = 10
default = 3
step = 0.5

[param.i18n."zh-Hans"]
label = "驱动"

[ffmpeg]
chain = "highpass=f=400,lowpass=f=3400,equalizer=f=1600:t=q:w=1.4:g={fixed(3 + drive / 2, 2)},alimiter=limit=0.92"
