format = 2

[effect]
id = "concat.night"
name = "Night"
kind = "filter"
category = "Cinematic"
order = 33
intensity = "lift"
description = "Low light opened up: shadows lifted with the noise softened before it rises, whites held, the blue of the night kept."

[effect.i18n."zh-Hans"]
name = "夜晚"
description = "把弱光打开：阴影在噪点冒头前提起并柔化、白色守住、夜的蓝保留。"
category = "电影感"

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "提升"

[[param]]
key = "clarity"
label = "Clarity"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "清晰度"

[wgsl]
entry = "effect.wgsl"
space = "display"
