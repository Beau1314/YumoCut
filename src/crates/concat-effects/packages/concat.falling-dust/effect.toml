format = 2

[effect]
id = "concat.falling-dust"
name = "Falling Dust"
kind = "filter"
category = "Retro"
order = 46
intensity = "dust"
description = "A warm fade with dust drifting down through it and a light leak in one corner. The CPU shows the fade and a whisper of noise."

[effect.i18n."zh-Hans"]
name = "落尘"
description = "温暖褪色中飘落的尘埃与一角的漏光。CPU 预览只显示褪色与一丝噪点。"
category = "复古"

[[param]]
key = "dust"
label = "Dust"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "灰尘"

[[param]]
key = "leak"
label = "Light leak"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "漏光"

[wgsl]
entry = "effect.wgsl"
space = "display"
