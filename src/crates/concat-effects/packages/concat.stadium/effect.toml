[effect]
id = "concat.stadium"
name = "Stadium"
kind = "audio"
category = "Space"
order = 35
intensity = "size"
aliases = ["arena"]
description = "Vast stadium echoes and reverberations across a massive arena."

[effect.i18n."zh-Hans"]
name = "体育场"
description = "巨大场馆里浩荡的回声与混响。"
category = "空间"

[[param]]
key = "size"
label = "Size"
min = 1
max = 10
default = 6
step = 0.5

[param.i18n."zh-Hans"]
label = "大小"

[ffmpeg]
chain = "aecho=0.8:0.88:{round(120 + size * 18)}|{round(240 + size * 36)}:0.45|0.28,lowpass=f=6500"
