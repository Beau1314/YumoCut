format = 2

[effect]
id = "concat.aquamarine"
name = "Aquamarine"
kind = "filter"
category = "Everyday"
order = 16
intensity = "water"
description = "Water and sky turned aquamarine and brightened, sand and skin left warm and clean. The beach-day look creators reach for first."

[effect.i18n."zh-Hans"]
name = "碧绿海水"
description = "水与天空转为碧绿并提亮，沙滩与肤色保持温暖干净。创作者最先想起的海滩日色调。"
category = "日常"

[[param]]
key = "water"
label = "Water"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "海水"

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "亮度"

[wgsl]
entry = "effect.wgsl"
space = "display"
