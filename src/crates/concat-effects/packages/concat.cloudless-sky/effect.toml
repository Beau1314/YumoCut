format = 2

[effect]
id = "concat.cloudless-sky"
name = "Cloudless Sky"
kind = "filter"
category = "Everyday"
order = 15
intensity = "sky"
description = "Skies deeper and bluer, foliage cooler and calmer, the rest of the picture and every face untouched. Travel footage."

[effect.i18n."zh-Hans"]
name = "晴空"
description = "天空更深更蓝、草木更冷静，画面其余部分与所有肤色不动。旅行素材适用。"
category = "日常"

[[param]]
key = "sky"
label = "Sky"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "天空"

[[param]]
key = "greens"
label = "Greens"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "草木"

[wgsl]
entry = "effect.wgsl"
space = "display"

# The reference picture has no sky; the card pushes both bands so the
# blue wall and the green jumper show the look.
[card]
params = { sky = 100, greens = 100 }
