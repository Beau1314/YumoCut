format = 2

[effect]
id = "concat.mint-haze"
name = "Mint Haze"
kind = "filter"
category = "Stylised"
order = 53
intensity = "amount"
description = "Soft green through the midtones and whites, colour muted, a light matte. The trend look, gentle enough for a face."

[effect.i18n."zh-Hans"]
name = "薄荷朦胧"
description = "中间调与白色里的柔绿、色彩收敛、一层轻哑光。潮流色，温和到能用在脸上。"
category = "风格化"

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "程度"

[wgsl]
entry = "effect.wgsl"
space = "display"
