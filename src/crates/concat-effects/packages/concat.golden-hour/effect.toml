format = 2

[effect]
id = "concat.golden-hour"
name = "Golden Hour"
kind = "filter"
category = "Everyday"
order = 14
intensity = "glow"
description = "Late light: a warm balance that keeps its brightness, orange in the highlights, a whisper of magenta in the shadows, blacks lifted a touch."

[effect.i18n."zh-Hans"]
name = "黄金时刻"
description = "迟来的光：保持亮度的暖平衡、高光里的橙、阴影里一丝品红、黑位轻轻提起。"
category = "日常"

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "柔光"

[[param]]
key = "warmth"
label = "Warmth"
min = 3500
max = 6500
default = 4600
step = 50
unit = "K"

[param.i18n."zh-Hans"]
label = "暖度"

[wgsl]
entry = "effect.wgsl"
space = "display"
