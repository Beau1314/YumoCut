format = 2

[effect]
id = "concat.light-leak-flash"
name = "Light Leak Flash"
kind = "transition"
category = "Light"
order = 16
description = "Organic overexposed film burn flash bridging the cut."

[effect.i18n."zh-Hans"]
name = "漏光闪光"
description = "有机的过曝胶片燃烧闪光横跨切换点。"
category = "光线"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "强度"

[transition]
entry = "effect.wgsl"
xfade = "fadewhite"
fallback = "cross-fade"

# By the usual point of the cut the flash has burned the frame white.
[card]
progress = 0.15
