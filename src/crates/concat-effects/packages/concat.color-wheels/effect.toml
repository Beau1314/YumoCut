format = 2

[effect]
id = "concat.color-wheels"
name = "Color Wheels"
kind = "effect"
category = "Color"
order = 14
description = "Lift, gamma and gain: the shadows, midtones and highlights each pushed towards a hue and made brighter or darker."

[effect.i18n."zh-Hans"]
name = "色轮"
description = "提升、伽马与增益：阴影、中间调与高光各自推向某个色相，并整体提亮或压暗。"
category = "色彩"

[[param]]
key = "lift"
group = "Wheels"
label = "Lift"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[param.i18n."zh-Hans"]
label = "提升"
group = "色轮"

[[param]]
key = "gamma"
group = "Wheels"
label = "Gamma"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[param.i18n."zh-Hans"]
label = "伽马"
group = "色轮"

[[param]]
key = "gain"
group = "Wheels"
label = "Gain"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[param.i18n."zh-Hans"]
label = "增益"
group = "色轮"

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a teal shadow and a warm
# highlight.
[card]
params = { "lift.x" = 0.0, "lift.y" = -0.6, "gain.x" = 0.35, "gain.y" = 0.45 }
