[effect]
id = "concat.cathedral"
name = "Cathedral"
kind = "audio"
category = "Space"
order = 34
intensity = "size"
aliases = ["cathedral"]
description = "Stone and height: reflections that take a while to arrive."

[effect.i18n."zh-Hans"]
name = "大教堂"
description = "石头与高度：需要一会儿才到的反射。"
category = "空间"

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "大小"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(120 * scale)}|{round(230 * scale)}|{round(390 * scale)}|{round(600 * scale)}:0.6|0.5|0.4|0.3"
