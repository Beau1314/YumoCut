format = 2

[effect]
id = "concat.spin"
name = "Spin"
kind = "transition"
category = "Spin"
order = 6
description = "The frame whirls round, blurring as it turns, and the next shot spins out of the turn and comes to rest."

[effect.i18n."zh-Hans"]
name = "旋转"
description = "画面旋转着模糊成一团，下一个镜头从旋转中转出并停稳。"
category = "旋转"

[[param]]
key = "turns"
label = "Turns"
min = 0.5
max = 2
step = 0.25
default = 1

[param.i18n."zh-Hans"]
label = "圈数"

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
