[effect]
id = "concat.denoise"
name = "Noise Reduction"
kind = "audio"
category = "Clean"
order = 41
intensity = "strength"
description = "Takes the hum and hiss out from under the voice."

[effect.i18n."zh-Hans"]
name = "降噪"
description = "去掉人声底下的嗡嗡与嘶嘶声。"
category = "清晰"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "强度"

[ffmpeg]
chain = "afftdn=nf={fixed(0 - 20 - strength / 100 * 30, 1)}:nr={fixed(6 + strength / 100 * 30, 1)}"
