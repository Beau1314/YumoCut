format = 2

[effect]
id = "concat.after-hours"
name = "After Hours"
kind = "filter"
category = "Cinematic"
order = 37
intensity = "depth"
description = "Deep blacks, a cool cast over everything but the lamps, colour low, a little grain. Late-night desk and monologue footage."

[effect.i18n."zh-Hans"]
name = "深夜"
description = "浓重的黑、除灯光外一片冷调、低饱和，带一点颗粒。适合深夜书桌与独白镜头。"
category = "电影感"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "深度"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "颗粒"

[wgsl]
entry = "effect.wgsl"
space = "display"
