[effect]
id = "concat.radio"
name = "Radio"
kind = "audio"
category = "Tone"
order = 24
intensity = "noise"
aliases = ["radio"]
description = "A small speaker on a long wave: narrow band, a little crunch."

[effect.i18n."zh-Hans"]
name = "收音机"
description = "长波上的小喇叭：窄频带，一点沙沙声。"
category = "音色"

[[param]]
key = "noise"
label = "Noise"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "噪声"

[ffmpeg]
let = [
  "bits = 16 - (noise / 100) * 12",
]
chain = "highpass=f=300,lowpass=f=3400,acrusher=bits={round(bits)}:mode=log:mix=0.6,alimiter=limit=0.9"
