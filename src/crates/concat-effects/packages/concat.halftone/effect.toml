format = 2

[effect]
id = "concat.halftone"
name = "Halftone"
version = 2
kind = "effect"
category = "Retro"
order = 76
intensity = "size"
description = "The picture reduced to a grid of black and white dots."

[effect.i18n."zh-Hans"]
name = "半调网点"
