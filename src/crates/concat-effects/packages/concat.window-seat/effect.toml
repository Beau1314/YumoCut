format = 2

[effect]
id = "concat.window-seat"
name = "Window Seat"
kind = "filter"
category = "Cinematic"
order = 35
intensity = "haze"
description = "Soft cinema: blacks lifted, the light blooming warm, shadows a touch cool, skin kept. The look of a story told in a window seat."

[effect.i18n."zh-Hans"]
name = "靠窗座"
description = "柔软的电影感：黑位抬起、光温暖地绽放、阴影微冷、肤色守住。靠窗座位上讲故事的样子。"
category = "电影感"

[[param]]
key = "haze"
label = "Haze"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "朦胧"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "暖度"

[wgsl]
entry = "effect.wgsl"
space = "display"
