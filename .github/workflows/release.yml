name: Release

# Compatibility entry point for the former all-platform Concat workflow.
# YumoCut currently supports and verifies Windows x86_64 only. Tag pushes
# are handled directly by release-windows.yml; this manual entry delegates
# to that same pipeline rather than maintaining a second release process.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing stable YumoCut tag, for example v0.2.12
        required: true
        type: string

jobs:
  windows:
    name: YumoCut for Windows
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
