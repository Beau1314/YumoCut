format = 2

[effect]
id = "concat.film"
name = "Film"
kind = "filter"
category = "Cinematic"
order = 34
intensity = "grain"
description = "A film curve with a real toe and shoulder, warm halation around the lights, and grain that moves. Print stock, not a filter."

[effect.i18n."zh-Hans"]
name = "胶片"
description = "带真实趾部与肩部的胶片曲线、灯光周围温暖的渗光，以及会动的颗粒。是印片 stock，不是滤镜。"
category = "电影感"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "颗粒"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "暖度"

[wgsl]
entry = "effect.wgsl"
space = "display"
