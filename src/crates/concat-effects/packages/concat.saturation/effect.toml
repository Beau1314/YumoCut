format = 2

[effect]
id = "concat.saturation"
name = "Saturation"
kind = "effect"
category = "Color"
order = 12
intensity = "amount"
description = "Richer or greyer colour, about each pixel's own brightness."

[effect.i18n."zh-Hans"]
name = "饱和度"
description = "围绕每个像素自身亮度的色彩浓淡。"
category = "色彩"

[[param]]
key = "amount"
label = "Saturation"
min = -100
max = 100
default = 0
step = 1
unit = "%"
animate = true

[param.i18n."zh-Hans"]
label = "饱和度"

[wgsl]
entry = "effect.wgsl"
space = "display"

# At its default the picture is as shot; the card shows a push.
[card]
params = { amount = 50 }
