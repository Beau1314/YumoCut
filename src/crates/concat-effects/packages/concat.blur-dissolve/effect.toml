format = 2

[effect]
id = "concat.blur-dissolve"
name = "Blur Dissolve"
kind = "transition"
category = "Dissolve"
order = 1
description = "Both shots go soft towards the cut and the swap happens inside the blur, then the next one comes back into focus."

[effect.i18n."zh-Hans"]
name = "模糊溶解"
description = "两个镜头在切换点前先后变虚，交接在模糊中完成，下一个镜头再回到焦点。"
category = "溶解"

[[param]]
key = "strength"
label = "Strength"
unit = "%"
min = 0
max = 100
step = 1
default = 60

[param.i18n."zh-Hans"]
label = "强度"

[transition]
fallback = "cross-fade"
xfade = "dissolve"
entry = "effect.wgsl"
