format = 2

[effect]
id = "concat.moody"
name = "Moody"
kind = "filter"
category = "Cinematic"
order = 31
intensity = "depth"
description = "Blacks crushed by a film toe, colour drained, bronze through the middle, cool in the shadows, the corners closing in."

[effect.i18n."zh-Hans"]
name = "忧郁"
description = "胶片趾部压碎的黑、抽干的色彩、中间调里的古铜、阴影里的冷，四角向内收拢。"
category = "电影感"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "深度"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "暖度"

[wgsl]
entry = "effect.wgsl"
space = "display"
