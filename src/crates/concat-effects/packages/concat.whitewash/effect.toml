format = 2

[effect]
id = "concat.whitewash"
name = "Whitewash"
kind = "filter"
category = "Everyday"
order = 17
intensity = "matte"
description = "Bright and matte: whites soft and cool, blacks lifted well off the floor, colour quiet. The clean minimal look of a white room."

[effect.i18n."zh-Hans"]
name = "粉刷白"
description = "明亮而哑光：白柔而冷、黑位离底很远、色彩安静。白房间的极简洁净感。"
category = "日常"

[[param]]
key = "matte"
label = "Matte"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "哑光"

[[param]]
key = "cool"
label = "Cool"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "冷度"

[wgsl]
entry = "effect.wgsl"
space = "display"
