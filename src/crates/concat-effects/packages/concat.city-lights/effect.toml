format = 2

[effect]
id = "concat.city-lights"
name = "City Lights"
kind = "filter"
category = "Stylised"
order = 52
intensity = "lights"
description = "Night city: the lights and signs made vivid and blooming, blacks kept deep and cool, faces left clean. Made for the strip."

[effect.i18n."zh-Hans"]
name = "城市灯火"
description = "夜城：灯与招牌鲜活绽放，黑位深而冷，人脸保持干净。为街拍而生。"
category = "风格化"

[[param]]
key = "lights"
label = "Lights"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "灯火"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "深度"

[wgsl]
entry = "effect.wgsl"
space = "display"
