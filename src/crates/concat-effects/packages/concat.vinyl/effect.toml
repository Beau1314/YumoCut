[effect]
id = "concat.vinyl"
name = "Vinyl"
kind = "audio"
category = "Tone"
order = 24
intensity = "warmth"
aliases = ["record", "gramophone"]
description = "Warm, vintage turntable character with band-limited sound."

[effect.i18n."zh-Hans"]
name = "黑胶"
description = "温暖的老唱机质感，频带受限的声音。"
category = "音色"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 10
default = 5
step = 0.5

[param.i18n."zh-Hans"]
label = "暖度"

[ffmpeg]
chain = "highpass=f=250,lowpass=f=5000,equalizer=f=1200:t=q:w=1.5:g={fixed(2 + warmth * 0.4, 2)},alimiter=limit=0.95"
