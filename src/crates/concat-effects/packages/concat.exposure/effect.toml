format = 2

[effect]
id = "concat.exposure"
name = "Exposure"
kind = "effect"
category = "Color"
order = 10
intensity = "stops"
description = "Brighter or darker by stops of light, as the lens would make it, highlights kept."

[effect.i18n."zh-Hans"]
name = "曝光"
description = "按光圈档位增减明暗，如镜头所做的那样，高光保留。"
category = "色彩"

[[param]]
key = "stops"
label = "Exposure"
min = -4
max = 4
default = 0
step = 0.05
unit = "EV"
animate = true

[param.i18n."zh-Hans"]
label = "曝光"

[wgsl]
entry = "effect.wgsl"

# At its default the picture is as shot; the card shows a stop up.
[card]
params = { stops = 1 }
