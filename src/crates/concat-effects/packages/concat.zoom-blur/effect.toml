format = 2

[effect]
id = "concat.zoom-blur"
name = "Zoom Blur"
kind = "effect"
category = "Blur"
order = 23
intensity = "amount"
description = "A rush towards a point, as if the lens zoomed during the shot."

[effect.i18n."zh-Hans"]
name = "缩放模糊"
description = "向一点的冲刺，像镜头在拍摄中变焦。"
category = "模糊"

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[param.i18n."zh-Hans"]
label = "程度"

[[param]]
key = "x"
label = "Centre X"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "中心 X"

[[param]]
key = "y"
label = "Centre Y"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "中心 Y"

[wgsl]
entry = "effect.wgsl"

# Sixteen scales a pass, each pass filling in between two of the next
# one's: four thousand and ninety-six along each streak.
[[wgsl.pass]]
target = "fine"

[[wgsl.pass]]
target = "middle"
