format = 2

[effect]
id = "concat.vibrance"
name = "Vibrance"
kind = "filter"
category = "Color"
order = 32
# 2: the parameter is `amount`; a project that stored `intensity` for it
# takes the default.
version = 2
intensity = "amount"
aliases = ["vibrance"]
description = "Richer colour where it is muted, without blowing out what is already strong."

[effect.i18n."zh-Hans"]
name = "自然饱和度"
description = "把暗淡处的色彩补浓，又不吹爆本来就浓的部分。"
category = "色彩"

[[param]]
key = "amount"
label = "Amount"
min = 0.1
max = 2
default = 0.7
step = 0.05

[param.i18n."zh-Hans"]
label = "程度"

[wgsl]
entry = "effect.wgsl"
space = "display"
