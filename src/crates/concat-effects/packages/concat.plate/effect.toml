[effect]
id = "concat.plate"
name = "Plate"
kind = "audio"
category = "Space"
order = 33
intensity = "size"
aliases = ["plate"]
description = "A studio plate: dense, bright and short."

[effect.i18n."zh-Hans"]
name = "板式混响"
description = "录音棚的声板：致密、明亮而短促。"
category = "空间"

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "大小"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(8 * scale)}|{round(17 * scale)}|{round(29 * scale)}|{round(43 * scale)}:0.45|0.35|0.25|0.15"
