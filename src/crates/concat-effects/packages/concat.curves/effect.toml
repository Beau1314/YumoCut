format = 2

[effect]
id = "concat.curves"
name = "Curves"
kind = "effect"
category = "Color"
order = 15
description = "The picture's levels bent along curves you draw: luma for brightness alone, then red, green and blue."

[effect.i18n."zh-Hans"]
name = "曲线"
description = "按你描绘的曲线弯折画面层级：亮度只管明暗，其后是红、绿、蓝。"
category = "色彩"

[[param]]
key = "luma"
group = "Curves"
label = "Luma"
type = "curve"

[param.i18n."zh-Hans"]
label = "亮度"
group = "曲线"

[[param]]
key = "red"
group = "Curves"
label = "Red"
type = "curve"

[param.i18n."zh-Hans"]
label = "红"
group = "曲线"

[[param]]
key = "green"
group = "Curves"
label = "Green"
type = "curve"

[param.i18n."zh-Hans"]
label = "绿"
group = "曲线"

[[param]]
key = "blue"
group = "Curves"
label = "Blue"
type = "curve"

[param.i18n."zh-Hans"]
label = "蓝"
group = "曲线"

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a gentle S.
[card]
params = { "luma.0.x" = 0.0, "luma.0.y" = 0.0, "luma.1.x" = 0.25, "luma.1.y" = 0.18, "luma.2.x" = 0.75, "luma.2.y" = 0.84, "luma.3.x" = 1.0, "luma.3.y" = 1.0 }
