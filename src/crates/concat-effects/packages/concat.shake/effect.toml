format = 2

[effect]
id = "concat.shake"
name = "Shake"
kind = "effect"
category = "Shake"
order = 4
intensity = "amount"
description = "A camera that will not keep still: a handheld drift, a nervous jitter or a quake, with a turn and a smear of its own."

[effect.i18n."zh-Hans"]
name = "抖动"
description = "一台不肯安分的相机：手持漂移、紧张抽动或地震摇晃，附赠一点自转与拖影。"
category = "抖动"

[[param]]
key = "style"
label = "Style"
type = "enum"
values = [0, 1, 2]
labels = ["Handheld", "Jitter", "Quake"]
default = 0
min = 0
max = 2

[param.i18n."zh-Hans"]
label = "样式"
labels = ["手持", "抽动", "地震"]

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[param.i18n."zh-Hans"]
label = "程度"

[[param]]
key = "speed"
label = "Speed"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[param.i18n."zh-Hans"]
label = "速度"

[[param]]
key = "rotation"
label = "Rotation"
unit = "%"
min = 0
max = 100
step = 1
default = 40

[param.i18n."zh-Hans"]
label = "旋转"

[[param]]
key = "blur"
label = "Motion Blur"
unit = "%"
min = 0
max = 100
step = 1
default = 40

[param.i18n."zh-Hans"]
label = "运动模糊"

[wgsl]
entry = "effect.wgsl"
