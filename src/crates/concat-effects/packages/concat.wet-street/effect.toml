format = 2

[effect]
id = "concat.wet-street"
name = "Wet Street"
kind = "filter"
category = "Cinematic"
order = 38
intensity = "haze"
description = "Cool, hazy and drained, with the wet reflections lifted and blooming. Street-level walks at the end of the day."

[effect.i18n."zh-Hans"]
name = "湿漉街道"
description = "冷、雾、低饱和，湿漉漉的反光被提起并绽放。一天将尽时的街拍。"
category = "电影感"

[[param]]
key = "haze"
label = "Haze"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "朦胧"

[[param]]
key = "chill"
label = "Chill"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "冷感"

[wgsl]
entry = "effect.wgsl"
space = "display"
