format = 2

[effect]
id = "concat.slide"
name = "Slide"
kind = "transition"
category = "Slide"
order = 4
description = "The next shot glides in over the last one and settles, casting a soft shadow on the shot it covers."

[effect.i18n."zh-Hans"]
name = "滑动"
description = "下一个镜头滑入覆盖上一个并停稳，在所覆盖的镜头上投下一道软影。"
category = "滑动"

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2, 3]
labels = ["Left", "Right", "Up", "Down"]
default = 0
min = 0
max = 3

[param.i18n."zh-Hans"]
label = "方向"
labels = ["向左", "向右", "向上", "向下"]

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
