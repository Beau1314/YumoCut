[effect]
id = "concat.room"
name = "Room"
kind = "audio"
category = "Space"
order = 31
intensity = "size"
aliases = ["room"]
description = "The early reflections of a room."

[effect.i18n."zh-Hans"]
name = "房间"
description = "一个房间的早期反射。"
category = "空间"

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "大小"

[ffmpeg]
let = [
  "scale = 0.4 + (size / 100) * 1.6",
]
chain = "aecho=0.8:0.88:{round(23 * scale)}|{round(41 * scale)}|{round(67 * scale)}|{round(97 * scale)}:0.320|0.240|0.170|0.110"
