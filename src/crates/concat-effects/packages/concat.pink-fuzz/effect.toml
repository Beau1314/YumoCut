format = 2

[effect]
id = "concat.pink-fuzz"
name = "Pink Fuzz"
kind = "filter"
category = "Stylised"
order = 50
intensity = "haze"
description = "Low contrast, pink and lavender in the light, and a soft bloom over it all. The dreamy one."

[effect.i18n."zh-Hans"]
