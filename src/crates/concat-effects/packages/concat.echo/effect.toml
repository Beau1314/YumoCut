[effect]
id = "concat.echo"
name = "Echo"
kind = "audio"
category = "Space"
order = 30
intensity = "decay"
aliases = ["echo"]
description = "One repeat, fading."

[effect.i18n."zh-Hans"]
name = "回声"
description = "一次重复，渐弱。"
category = "空间"

[[param]]
key = "delay"
label = "Delay"
min = 0.05
max = 1
default = 0.25
step = 0.05
unit = "s"

[param.i18n."zh-Hans"]
label = "延迟"

[[param]]
key = "decay"
label = "Decay"
min = 0.1
max = 0.9
default = 0.4
step = 0.05

[param.i18n."zh-Hans"]
label = "衰减"

[ffmpeg]
chain = "aecho=0.8:0.85:{round(delay * 1000)}:{fixed(decay, 2)}"
