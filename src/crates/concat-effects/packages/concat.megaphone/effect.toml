[effect]
id = "concat.megaphone"
name = "Megaphone"
kind = "audio"
category = "Voice"
order = 15
intensity = "drive"
aliases = ["bullhorn", "loudspeaker"]
description = "Harsh, mid-focused projection from a handheld megaphone."

[effect.i18n."zh-Hans"]
name = "扩音器"
description = "手持扩音器那种生硬、以中频为主的投射。"
category = "人声"

[[param]]
key = "drive"
label = "Drive"
min = 1
max = 10
default = 5
step = 0.5

[param.i18n."zh-Hans"]
label = "驱动"

[ffmpeg]
chain = "highpass=f=550,lowpass=f=2800,equalizer=f=1600:t=q:w=2.0:g={fixed(3 + drive * 0.8, 2)},alimiter=limit=0.88"
