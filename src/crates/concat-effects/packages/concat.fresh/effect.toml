format = 2

[effect]
id = "concat.fresh"
name = "Fresh"
kind = "filter"
category = "Everyday"
order = 10
intensity = "pop"
description = "Daylight footage made to pop: midtones lifted, colour brought up where it is muted, a breath of mint in the brightest whites, skin left alone."

[effect.i18n."zh-Hans"]
name = "清新"
description = "让日光素材跳出来：中间调提起、暗淡处补上色彩、最亮的高光里透一丝薄荷，肤色不动。"
category = "日常"

[[param]]
key = "pop"
label = "Pop"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "鲜明"

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "亮度"

[wgsl]
entry = "effect.wgsl"
space = "display"
