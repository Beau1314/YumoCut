format = 2

[effect]
id = "concat.blush"
name = "Blush"
kind = "filter"
category = "Portrait"
order = 20
intensity = "glow"
description = "Skin warmed toward peach and softened, shadows lifted so lines ease, contrast low. Portraits and talking heads; it is meant to run at half strength."

[effect.i18n."zh-Hans"]
name = "红润"
description = "肤色向蜜桃色暖化并柔化，阴影提起让细纹舒展，对比降低。人像与出镜口播适用；建议半强度使用。"
category = "人像"

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "柔光"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[param.i18n."zh-Hans"]
label = "柔化"

[wgsl]
entry = "effect.wgsl"
space = "display"
