format = 2

[effect]
id = "concat.zoom-transition"
name = "Zoom"
kind = "transition"
category = "Zoom"
order = 3
aliases = ["zoom"]
description = "One unbroken push of the camera: into the last shot and on out of it into the next, streaked by the speed."

[effect.i18n."zh-Hans"]
name = "缩放"
description = "一记不换气的推镜：推进前一镜头并继续推出到下一个，速度拉出拖影。"
category = "缩放"

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1]
labels = ["In", "Out"]
default = 0
min = 0
max = 1

[param.i18n."zh-Hans"]
label = "方向"
labels = ["推入", "拉出"]

[transition]
fallback = "cross-fade"
xfade = "zoomin"
entry = "effect.wgsl"
